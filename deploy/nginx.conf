# Example: mount as /etc/nginx/nginx.conf.
# Replace review.example.com and mount its TLS certificate and private key.
# be-api and webhook are private service DNS names in the deployment network.
worker_processes auto;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Do not log query strings, Authorization, signatures or request bodies.
    log_format gateway '$request_id $remote_addr $request_method $uri '
                       '$status $request_time';
    access_log /dev/stdout gateway;
    server_tokens off;

    upstream portal_backend {
        server be-api:8000;
        keepalive 16;
    }

    upstream webhook_backend {
        server webhook:8000;
        keepalive 16;
    }

    server {
        listen 443 ssl;
        server_name review.example.com;

        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Nginx is the first public hop in this example.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Preserve Authorization, GitHub headers and the original body.
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 10s;
        # Application delivery IDs and admission keys own deduplication.
        proxy_next_upstream off;

        location /api/v1/ {
            client_max_body_size 1m;
            proxy_read_timeout 30s;
            # No URI suffix: preserve the /api/v1/ prefix.
            proxy_pass http://portal_backend;
        }

        location = /webhooks/github {
            client_max_body_size 25m;
            proxy_read_timeout 10s;
            proxy_pass http://webhook_backend;
        }

        location / {
            return 404;
        }
    }
}

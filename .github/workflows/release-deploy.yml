name: API Release Pipeline

on:
  push:
    branches: [ main, develop, 'feature/**' ]

concurrency:
  group: deploy-${{ github.ref_name == 'main' && 'prod' || 'staging' }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      environment: ${{ steps.meta.outputs.environment }}
      suffix: ${{ steps.meta.outputs.suffix }}
      api_port: ${{ steps.meta.outputs.api_port }}
      redis_db: ${{ steps.meta.outputs.redis_db }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag and target environment
        id: meta
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dmc-268-api-t5:${{ github.sha }}"
          echo "image=$(echo $IMG | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
          if [ "${{ github.ref_name }}" = "main" ]; then
            { echo "environment=production"; echo "suffix=prod"; echo "api_port=8000"; echo "redis_db=0"; } >> $GITHUB_OUTPUT
          else
            { echo "environment=staging"; echo "suffix=staging"; echo "api_port=8100"; echo "redis_db=1"; } >> $GITHUB_OUTPUT
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ needs.build-and-push.outputs.environment }}
    steps:
      - name: Deploy Postgres, API and worker via SSH (zero-disk secrets)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_DMC268_IP_T5 }}
          username: ${{ secrets.VPS_DMC268_U }}
          password: ${{ secrets.VPS_DMC268_P }}
          script_stop: true
          script: |
            IMAGE="${{ needs.build-and-push.outputs.image }}"
            SFX="${{ needs.build-and-push.outputs.suffix }}"
            PORT="${{ needs.build-and-push.outputs.api_port }}"
            REDIS_DB="${{ needs.build-and-push.outputs.redis_db }}"
            DB_NAME="dmc_${SFX}"
            API="dmc-api-${SFX}"
            WORKER="dmc-worker-${SFX}"

            command -v docker >/dev/null || { echo "ОШИБКА: docker не установлен. Сначала запустите workflow Terraform Deploy to VPS."; exit 1; }
            [ -n "${{ secrets.DB_PASSWORD }}" ] || { echo "ОШИБКА: секрет DB_PASSWORD пуст (проверьте secrets репозитория/Environment)."; exit 1; }
            [ -n "${{ secrets.LLM_API_KEY }}" ] || echo "ВНИМАНИЕ: секрет LLM_API_KEY пуст."

            echo "1. Авторизация в GHCR и загрузка образа..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull "$IMAGE"

            echo "2. Postgres (создается один раз, пароль через STDIN)..."
            docker network inspect dmc-net >/dev/null 2>&1 || docker network create dmc-net
            docker volume inspect dmc-pgdata >/dev/null 2>&1 || docker volume create dmc-pgdata
            if ! docker inspect dmc-postgres >/dev/null 2>&1; then
              echo "POSTGRES_PASSWORD=${{ secrets.DB_PASSWORD }}" | docker run -d \
                --name dmc-postgres --restart unless-stopped --network dmc-net \
                -v dmc-pgdata:/var/lib/postgresql/data \
                --health-cmd "pg_isready -U postgres" --health-interval 5s \
                --env-file - postgres:17-alpine
            fi
            docker start dmc-postgres >/dev/null 2>&1 || true
            for i in $(seq 1 30); do
              docker exec dmc-postgres pg_isready -U postgres >/dev/null 2>&1 && break
              sleep 1
            done
            docker exec dmc-postgres psql -U postgres -tAc "SELECT 1 FROM pg_database WHERE datname='${DB_NAME}'" | grep -q 1 \
              || docker exec dmc-postgres psql -U postgres -c "CREATE DATABASE ${DB_NAME}"

            rollback() {
              echo "ОШИБКА: новая версия не запустилась, выполняю откат..."
              docker logs --tail 50 "$API" 2>&1 || true
              docker rm -f "$API" "$WORKER" >/dev/null 2>&1 || true
              if [ "$HAS_PREV" = "1" ]; then
                docker rename "${API}-prev" "$API" && docker start "$API"
                [ "$HAS_PREV_W" = "1" ] && docker rename "${WORKER}-prev" "$WORKER" && docker start "$WORKER"
                echo "Откат выполнен: запущена предыдущая версия."
              else
                echo "Предыдущей версии нет, откатываться некуда."
              fi
              exit 1
            }

            echo "3. Ротация контейнеров (старые сохраняются для отката)..."
            docker rm -f "${API}-prev" "${WORKER}-prev" >/dev/null 2>&1 || true
            HAS_PREV=0; HAS_PREV_W=0
            if docker inspect "$API" >/dev/null 2>&1; then
              docker stop "$API"; docker rename "$API" "${API}-prev"; HAS_PREV=1
            fi
            if docker inspect "$WORKER" >/dev/null 2>&1; then
              docker stop "$WORKER"; docker rename "$WORKER" "${WORKER}-prev"; HAS_PREV_W=1
            fi

            ENV_STREAM() {
              cat << EOF
            APP_ENV=${{ needs.build-and-push.outputs.environment }}
            RELEASE_TAG=${{ github.sha }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            DATABASE_URL=postgresql://postgres:${{ secrets.DB_PASSWORD }}@dmc-postgres:5432/${DB_NAME}
            REDIS_URL=redis://dmc-redis:6379/${REDIS_DB}
            EOF
            }

            echo "4. Запуск API (секреты через STDIN)..."
            ENV_STREAM | sed 's/^ *//' | docker run -d --name "$API" --restart unless-stopped \
              --network dmc-net -p "${PORT}:8000" --env-file - "$IMAGE" || rollback

            echo "5. Запуск worker (ARQ)..."
            ENV_STREAM | sed 's/^ *//' | docker run -d --name "$WORKER" --restart unless-stopped \
              --network dmc-net --no-healthcheck --env-file - "$IMAGE" \
              arq app.worker.WorkerSettings || rollback

            echo "6. Проверка /healthcheck (до 30 секунд)..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS "http://localhost:${PORT}/healthcheck" >/dev/null 2>&1; then HEALTHY=1; break; fi
              sleep 1
            done
            [ "$HEALTHY" = "1" ] || rollback
            sleep 3
            [ "$(docker inspect -f '{{.State.Running}}' "$WORKER")" = "true" ] || rollback

            echo "7. Успех, удаляю резервные контейнеры."
            docker rm -f "${API}-prev" "${WORKER}-prev" >/dev/null 2>&1 || true
            docker ps --filter name=dmc-

      - name: Verify API health from runner
        run: |
          PORT=${{ needs.build-and-push.outputs.api_port }}
          curl -fsS --connect-timeout 10 --retry 5 --retry-delay 3 --retry-all-errors \
            http://${{ vars.VPS_DMC268_IP_T5 }}:${PORT}/healthcheck

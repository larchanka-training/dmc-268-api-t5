name: API Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  build-and-push:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.image_meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute Image Tag
        id: image_meta
        run: |
          IMG="ghcr.io/${{ github.repository_owner }}/dmc-268-api-t5:${{ github.ref_name }}"
          echo "image=$(echo $IMG | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.image_meta.outputs.image }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API Container via SSH (Zero-Disk Secrets)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ vars.VPS_DMC268_IP_T5 }}
          username: ${{ secrets.VPS_DMC268_U }}
          password: ${{ secrets.VPS_DMC268_P }}
          script_stop: true
          script: |
            echo "1. Авторизация в GHCR на сервере..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "2. Загрузка нового образа..."
            docker pull ${{ needs.build-and-push.outputs.image_tag }}

            rollback() {
              echo "ОШИБКА: новая версия не запустилась, выполняю откат..."
              docker logs --tail 50 dmc-api 2>&1 || true
              docker rm -f dmc-api >/dev/null 2>&1 || true
              if [ "$HAS_PREV" = "1" ]; then
                docker rename dmc-api-prev dmc-api
                docker start dmc-api
                echo "Откат выполнен: запущена предыдущая версия."
              else
                echo "Предыдущей версии нет, откатываться некуда."
              fi
              exit 1
            }

            echo "3. Ротация контейнера (старый сохраняется для отката)..."
            docker rm -f dmc-api-prev >/dev/null 2>&1 || true
            HAS_PREV=0
            if docker inspect dmc-api >/dev/null 2>&1; then
              docker stop dmc-api
              docker rename dmc-api dmc-api-prev
              HAS_PREV=1
            fi

            echo "4. Запуск контейнера с передачей секретов через STDIN в память..."
            cat << 'EOF' | docker run -d \
              --name dmc-api \
              --restart unless-stopped \
              --network dmc-net \
              -p 8000:8000 \
              --env-file - \
              ${{ needs.build-and-push.outputs.image_tag }} || rollback
            LLM_API_KEY=${{ secrets.LLM_API_KEY }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            APP_ENV=staging
            RELEASE_TAG=${{ github.ref_name }}
            EOF

            echo "5. Проверка: на диске нет .env файлов:"
            ls -la /opt/dmc-268/ 2>/dev/null | grep -i "\.env" || echo "Подтверждено: файлов .env на диске нет."

            echo "6. Проверка /healthcheck на сервере (до 30 секунд)..."
            HEALTHY=0
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:8000/healthcheck >/dev/null 2>&1; then
                HEALTHY=1
                break
              fi
              sleep 1
            done
            [ "$HEALTHY" = "1" ] || rollback

            echo "7. Новая версия здорова, удаляю резервный контейнер."
            docker rm -f dmc-api-prev >/dev/null 2>&1 || true
            docker ps --filter name=dmc-api

      - name: Verify API Health from Runner
        run: |
          echo "Проверка доступности API с раннера..."
          curl -fsS --connect-timeout 10 --retry 5 --retry-delay 3 --retry-all-errors \
            http://${{ vars.VPS_DMC268_IP_T5 }}:8000/healthcheck

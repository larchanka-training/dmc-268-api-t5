name: Terraform Deploy to VPS

on:
  workflow_dispatch: # Ручной запуск по кнопке
  push:
    paths:
      - 'terraform/**'
    branches: [ main ]

jobs:
  terraform-apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.0

      - name: Terraform Init & Validate
        run: |
          cd terraform
          terraform init
          terraform validate

      - name: Terraform Apply (Подъем базового контейнера)
        env:
          TF_VAR_app_domain: ${{ vars.APP_DOMAIN }}
        run: |
          cd terraform
          terraform apply -auto-approve \
            -var="vps_host=${{ vars.VPS_DMC268_IP_T5 }}" \
            -var="vps_user=${{ secrets.VPS_DMC268_U }}" \
            -var="vps_password=${{ secrets.VPS_DMC268_P }}"

      - name: Check Caddy from Runner
        env:
          APP_DOMAIN: ${{ vars.APP_DOMAIN }}
          VPS_IP: ${{ vars.VPS_DMC268_IP_T5 }}
        run: |
          DOMAIN="${APP_DOMAIN:-$(echo "$VPS_IP" | tr . -).sslip.io}"
          echo "Проверка Caddy: http://${DOMAIN} должен отвечать редиректом на HTTPS..."
          curl -sI --retry 5 --retry-delay 3 --retry-all-errors "http://${DOMAIN}" | grep "HTTP/"
          echo "Production: https://${DOMAIN}"
          echo "Staging:    https://staging.${DOMAIN}"